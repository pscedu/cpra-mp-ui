name: Create release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      upload_url: ${{ steps.rp.outputs.upload_url }}
    steps:
      - name: Release please
        id: rp
        uses: googleapis/release-please-action@v4
        with:
          release-type: node
          target-branch: ${{ github.ref_name }}

  build-publish:
    name: Build and publish module
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: npm ci
      - name: Build assets
        run: npm run build-library
      - name: Determine NPM tag
        id: npm-tag
        run: echo npm-tag=$(jq -r .version package.json | grep -q 'alpha\|beta\|rc' && echo "next" || echo "latest") >> $GITHUB_OUTPUT
      - run: npm publish --access public --tag ${{ steps.npm-tag.outputs.npm-tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-image:
    name: Build and Push App Image
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Prepare image
        id: prepare
        run: |
          VERSION=$(echo "${{ needs.release.outputs.tag_name }}" | sed -e 's|^v||')
          echo "image_tag=ghcr.io/${{ github.repository }}:$VERSION" >> $GITHUB_OUTPUT
      - name: Build image
        run: |
          podman build . --file Containerfile --tag "${{ steps.prepare.outputs.image_tag }}" --label "runnumber=${GITHUB_RUN_ID}"
      - name: Log in to registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            podman login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push image
        run: |
          podman push "${{ steps.prepare.outputs.image_tag }}"
